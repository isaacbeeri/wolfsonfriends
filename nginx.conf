server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Defense-in-Depth Security & Anti-Indexing Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Strictly block direct requests to raw data, spreadsheets, databases and log files
    location ~* \.(?:xlsx|xls|csv|db|sqlite|sqlite3|env|bak|log|sql|jsonl)$ {
        deny all;
        return 404;
    }

    # SPA routing fallback: send all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dedicated MP4 video streaming block with byte-range support
    location ~* \.mp4$ {
        mp4;
        mp4_buffer_size 4m;
        mp4_max_buffer_size 100m;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Cache static assets (images, fonts, documents)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Health check endpoint for Cloud Run
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
